<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<title>PMSignalPro Tester</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body>
<div class="app">
  <header class="mini-head">
    <button class="head-action" onclick="home()" aria-label="Главная">×</button>
    <div class="head-brand"><b>PMSignalPro Tester</b><span>mini app</span></div>
    <button class="head-action info-action" aria-label="Информация">ⓘ</button>
  </header>
  <main id="screen"></main>
  <nav class="bottom-nav">
    <button data-screen="home"><span>⌂</span><small>Главная</small></button>
    <button data-screen="results"><span>▤</span><small>Результаты</small></button>
    <button data-screen="errors"><span>⚠</span><small>Ошибки</small></button>
    <button data-screen="infra"><span>◈</span><small>GitHub/Render</small></button>
    <button data-screen="sections"><span>☷</span><small>Разделы</small></button>
    <button data-screen="history"><span>◷</span><small>История</small></button>
  </nav>
</div>
<script src="/static/app.js?v=8"></script>
</body>
</html>
